<!DOCTYPE html>
<html>

<head>
    <title>Checkout - My Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Checkout 🛒</h1>

    </header>

    <main>
<h2>Order Summary</h2>

<div id="checkoutItems"></div>

<h3>
    Total: ₹<span id="checkoutTotal">0</span>
</h3>
        <h2>Customer Details</h2>

        <form id="checkoutForm">

            <label>
                Name
            </label>

            <input
                type="text"
                id="customerName"
                required
            >

            <br><br>

            <label>
                Email
            </label>

            <input
                type="email"
                id="customerEmail"
                required
            >

            <br><br>

            <label>
                Address
            </label>

            <textarea
                id="customerAddress"
                required
            ></textarea>

            <br><br>

            <button type="submit">
                Place Order
            </button>

        </form>

    </main>

    <script src="checkout.js"></script>

</body>

</html>
